[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creaseiq"
version = "0.1.0"
description = "CreaseIQ - IPL match intelligence: validated data pipeline, analytics and a leakage-safe win-probability engine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jyotshna Payasi" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "SQLAlchemy>=2.0",
    "pandera>=0.20",
    "typer>=0.12",
    "rich>=13",
    "streamlit>=1.38",
    "plotly>=5.22",
    "PyYAML>=6",
    "Jinja2>=3.1",
    "joblib>=1.4",
    "pyarrow>=16",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "import-linter>=2.0",
    "pypdf>=4",
    "types-PyYAML",
]

[project.scripts]
creaseiq = "creaseiq.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
creaseiq = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (full dataset / full training)",
    "app: Streamlit AppTest smoke tests",
]
filterwarnings = ["ignore::DeprecationWarning:streamlit.*"]

[tool.coverage.run]
source = ["creaseiq"]
omit = ["*/app/*", "*/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "S", "C4", "RUF"]
# E501: line length is enforced by `ruff format`; long string/table literals are allowed.
ignore = ["S101", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802", "N806"]
# Streamlit multipage convention: Home.py and pages/1_Name.py are not valid module names.
"src/creaseiq/app/**" = ["N999"]
# Typer declares CLI options through default arguments (documented idiom).
"src/creaseiq/cli.py" = ["B008"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
exclude = ["src/creaseiq/app/"]

[[tool.mypy.overrides]]
module = ["creaseiq.app.*"]
ignore_errors = true

[tool.importlinter]
root_package = "creaseiq"

[[tool.importlinter.contracts]]
name = "Layered architecture (dependencies point downward only)"
type = "layers"
layers = [
    "creaseiq.app : creaseiq.cli",
    "creaseiq.services",
    "creaseiq.analytics : creaseiq.features : creaseiq.models : creaseiq.simulation : creaseiq.reporting : creaseiq.viz",
    "creaseiq.data : creaseiq.db",
    "creaseiq.config : creaseiq.logging_setup : creaseiq.exceptions : creaseiq.utils",
]
