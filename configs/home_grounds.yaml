# Home grounds by franchise and era (R2). Used for the is_home feature and home-advantage analytics.
# A match is "home" for a team if the venue is one of its home venue_ids for that season_year,
# and the season is not neutral. Secondary homes count as home (the franchise sold the tickets).

neutral_seasons:
  2009: "Held in South Africa"
  2020: "Held in the UAE"
  2021: "India phase in neutral hubs, then UAE"
  2022: "League stage in a Maharashtra hub (Mumbai/Pune); playoffs Kolkata/Ahmedabad"
# The 2014 first leg (UAE) is neutral in part: UAE venues are simply not listed as anyone's
# home, so those matches resolve to neutral automatically. When a relocated venue hosts two
# 'home' teams (Visakhapatnam 2016: MI, RPS and SRH), both flags are set and cancel out in
# the home-difference feature.

homes:
  csk:
    - {venues: [chepauk], from: 2008, to: 2026}
