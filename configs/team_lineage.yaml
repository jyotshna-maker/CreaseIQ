# Franchise lineage (FR-02). Built from Phase 0 research R2; continuity rules in ADR-003.
# Renames of the SAME franchise share a franchise_id (ratings/history carry over).
# Distinct franchises (new owner/contract) get their own id even if they share a city.
# Any raw team string not listed here makes the pipeline fail loudly.
# Current names of active franchises are open-ended (valid_to: 2100) so future seasons can be appended.

franchises:
  csk:            {name: Chennai Super Kings, short: CSK, active: true, note: "Suspended 2016-17"}
  mi:             {name: Mumbai Indians, short: MI, active: true}
  kkr:            {name: Kolkata Knight Riders, short: KKR, active: true}
  rr:             {name: Rajasthan Royals, short: RR, active: true, note: "Suspended 2016-17"}
  dc:             {name: Delhi Capitals, short: DC, active: true, note: "Delhi Daredevils until 2018"}
  pbks:           {name: Punjab Kings, short: PBKS, active: true, note: "Kings XI Punjab until 2020"}
  rcb:            {name: Royal Challengers Bengaluru, short: RCB, active: true, note: "Royal Challengers Bangalore until 2023"}
  srh:            {name: Sunrisers Hyderabad, short: SRH, active: true, note: "New franchise 2013; not a continuation of Deccan Chargers"}
  gt:             {name: Gujarat Titans, short: GT, active: true, note: "New franchise 2022; unrelated to Gujarat Lions"}
  lsg:            {name: Lucknow Super Giants, short: LSG, active: true, note: "New franchise 2022"}
  deccan_chargers: {name: Deccan Chargers, short: DCH, active: false, note: "2008-2012, terminated"}
  gujarat_lions:  {name: Gujarat Lions, short: GL, active: false, note: "2016-2017 stand-in"}
  rps:            {name: Rising Pune Supergiant, short: RPS, active: false, note: "2016-2017; 'Supergiants' in 2016"}
  pune_warriors:  {name: Pune Warriors India, short: PWI, active: false, note: "2011-2013"}
  kochi_tuskers:  {name: Kochi Tuskers Kerala, short: KTK, active: false, note: "2011 only"}

